<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>1080×1920 Vertical Media Slider (MP4 + GIF)</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Lexend:wght@400;700&display=swap");

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #362a2b;
      color: #e5ebf3;
      font-family: "Lexend", sans-serif;
      display: grid;
      place-items: center;
    }

    /* ====== 1080x1920 frame (keeps 9:16 on smaller screens) ====== */
    .slider {
      position: relative;
      width: 1080px;
      height: 1920px;
      aspect-ratio: 9 / 16;
      height: min(1920px, 100vh);
      width: calc(min(1920px, 100vh) * 9 / 16);
      overflow: hidden;
      border-radius: 16px;
    }

    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.4s ease-in-out;
      background: #000; /* prevents flashes while loading */
    }
    .slide.current { opacity: 1; }

    /* Media fills slide */
    .slide > .media {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;       /* crop to fill */
      object-position: center; /* adjust if needed */
      display: block;
    }

    /* Optional caption block */
    .content {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 48px;
      line-height: 1.6;
      background: rgba(0,0,0,0.35);
      padding: 16px 20px;
      border-radius: 12px;
      backdrop-filter: blur(2px);
    }
    .content h1 { font-size: 28px; margin-bottom: 8px; }
    .content p  { font-size: 16px; }

    /* Nav buttons */
    .buttons {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .buttons button {
      pointer-events: auto;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      border: 2px solid #e5ebf3;
      background: transparent;
      color: #e5ebf3;
      cursor: pointer;
      padding: 12px 14px;
      border-radius: 50%;
      outline: none;
    }
    .buttons #prev { left: 16px; }
    .buttons #next { right: 16px; }
    .buttons button:hover {
      background-color: #e5ebf3;
      color: #362a2b;
    }
  </style>
</head>
<body>

  <div class="slider" id="slider">
    <!-- Slide 1: MP4 -->
    <div class="slide current">
      <video class="media" muted playsinline loop preload="auto">
        <source src="2.mp4" type="video/mp4">
      </video>
      <!-- <div class="content"><h1>Title</h1><p>Description</p></div> -->
    </div>

    <!-- Slide 2: GIF -->
    <div class="slide">
      <img class="media" src="1.gif" alt="GIF slide">
    </div>

    <!-- Slide 3: MP4 -->
    <div class="slide">
      <video class="media" muted playsinline loop preload="auto">
        <source src="3.mp4" type="video/mp4">
      </video>
    </div>

    <!-- Slide 4: GIF -->
    <div class="slide">
      <img class="media" src="4.mp4" alt="GIF slide">
    </div>


    <div class="buttons">
      <button id="prev" aria-label="Previous slide"><i class="fas fa-arrow-left"></i></button>
      <button id="next" aria-label="Next slide"><i class="fas fa-arrow-right"></i></button>
    </div>
  </div>

  <script>
    const slides = Array.from(document.querySelectorAll(".slide"));
    const nextButton = document.getElementById("next");
    const prevButton = document.getElementById("prev");

    const auto = true;
    const intervalTime = 5000;
    let slideInterval;

    // Helper: play current video, pause others (GIFs ignore this)
    function syncVideoPlayback() {
      slides.forEach(slide => {
        const vid = slide.querySelector("video.media");
        if (!vid) return;

        if (slide.classList.contains("current")) {
          // Some browsers block autoplay if not muted/inline; we already set that.
          const playPromise = vid.play();
          if (playPromise && typeof playPromise.catch === "function") {
            playPromise.catch(() => {/* ignore */});
          }
        } else {
          vid.pause();
          // Optional: reset to start when leaving the slide
          vid.currentTime = 0;
        }
      });
    }

    function goToNext() {
      const current = document.querySelector(".slide.current");
      current.classList.remove("current");
      const next =
        current.nextElementSibling && current.nextElementSibling.classList.contains("slide")
          ? current.nextElementSibling
          : slides[0];
      next.classList.add("current");
      syncVideoPlayback();
    }

    function goToPrev() {
      const current = document.querySelector(".slide.current");
      current.classList.remove("current");
      const prev =
        current.previousElementSibling && current.previousElementSibling.classList.contains("slide")
          ? current.previousElementSibling
          : slides[slides.length - 1];
      prev.classList.add("current");
      syncVideoPlayback();
    }

    nextButton.addEventListener("click", () => {
      goToNext();
      if (auto) {
        clearInterval(slideInterval);
        slideInterval = setInterval(goToNext, intervalTime);
      }
    });

    prevButton.addEventListener("click", () => {
      goToPrev();
      if (auto) {
        clearInterval(slideInterval);
        slideInterval = setInterval(goToNext, intervalTime);
      }
    });

    // Kick things off
    syncVideoPlayback(); // ensure the first slide plays if it's a video
    if (auto) slideInterval = setInterval(goToNext, intervalTime);

    // Optional: autoplay resume on visibility change
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        slides.forEach(s => s.querySelector("video")?.pause());
      } else {
        syncVideoPlayback();
      }
    });
  </script>
</body>
</html>
